name: CI / CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, Test & Validate Warehouse
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Static Code Analysis & Linting (Ruff)
        run: |
          ruff check .

      - name: Run Pytest Unit Tests
        run: |
          pytest -v tests/

      - name: Seed Synthetic CI DuckDB Warehouse
        run: |
          python scripts/ci_prepare_test_db.py

      - name: Build dbt Models (Staging, Intermediate, Marts)
        working-directory: nyc_taxi_dbt
        run: |
          dbt deps --profiles-dir .
          dbt run --profiles-dir .


      - name: Run dbt Data Quality & Contract Tests
        working-directory: nyc_taxi_dbt
        run: |
          dbt test --profiles-dir .
