version: 2

models:
  - name: stg_trips
    description: >
      Standardized staging model for NYC TLC yellow taxi trip records.
      Renamed from raw PySpark column names to snake_case analytical standard.
      Surrogate trip_id generated via MD5 hash of natural keys.
    columns:
      - name: trip_id
        description: MD5 surrogate key uniquely identifying each trip.
        tests:
          - unique
          - not_null
      - name: vendor_id
        description: Taxi vendor identifier (1 = Creative Mobile, 2 = VeriFone).
        tests:
          - not_null
      - name: pickup_at
        description: Timestamp when the meter was engaged.
        tests:
          - not_null
      - name: dropoff_at
        description: Timestamp when the meter was disengaged.
        tests:
          - not_null
      - name: pickup_location_id
        description: TLC taxi zone location ID for the pickup.
        tests:
          - not_null
      - name: dropoff_location_id
        description: TLC taxi zone location ID for the dropoff.
        tests:
          - not_null
      - name: trip_distance_miles
        description: Trip distance in miles reported by the taximeter.
        tests:
          - not_null
      - name: fare_amount
        description: Metered fare before surcharges.
        tests:
          - not_null
      - name: total_amount
        description: Total amount charged to the passenger.
        tests:
          - not_null

  - name: stg_zones
    description: Standardized staging model for NYC TLC taxi zone lookup table.
    columns:
      - name: location_id
        description: Unique zone identifier matching pickup/dropoff location IDs.
        tests:
          - unique
          - not_null
      - name: borough
        description: NYC borough name.
        tests:
          - not_null
      - name: zone_name
        description: Human-readable taxi zone name.
        tests:
          - not_null
