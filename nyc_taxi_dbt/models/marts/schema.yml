version: 2

models:
  - name: fct_trips
    description: >
      Fact table for NYC TLC yellow taxi trip records.
      Grain: one row per trip. Contains all additive measures and foreign keys
      to dim_zones and dim_date. Source of truth for all analytical dashboards.
    columns:
      - name: trip_id
        description: MD5 surrogate key uniquely identifying each trip.
        tests:
          - unique
          - not_null
      - name: pickup_location_id
        description: Foreign key → dim_zones.location_id (pickup zone).
        tests:
          - not_null
          - relationships:
              to: ref('dim_zones')
              field: location_id
      - name: dropoff_location_id
        description: Foreign key → dim_zones.location_id (dropoff zone).
        tests:
          - not_null
      - name: pickup_at
        description: Pickup timestamp.
        tests:
          - not_null
      - name: dropoff_at
        description: Dropoff timestamp.
        tests:
          - not_null
      - name: fare_amount
        description: Metered fare amount in USD.
        tests:
          - not_null
      - name: total_amount
        description: Total charge to the passenger in USD.
        tests:
          - not_null
      - name: trip_distance_miles
        description: Trip distance in miles.
        tests:
          - not_null
      - name: payment_method
        description: Human-readable payment method label.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Credit Card
                  - Cash
                  - No Charge
                  - Dispute
                  - Unknown
                  - Voided Trip
                  - Other
      - name: time_of_day_segment
        description: Categorical time-of-day label for the pickup hour.
        tests:
          - not_null

  - name: dim_zones
    description: >
      Dimension table for all 265 NYC TLC taxi zones.
      Maps TLC location IDs to borough, zone name, and service zone classification.
    columns:
      - name: location_id
        description: Primary key — unique TLC taxi zone identifier.
        tests:
          - unique
          - not_null
      - name: borough
        description: NYC borough (Manhattan, Brooklyn, Queens, Bronx, Staten Island, EWR).
        tests:
          - not_null
      - name: zone_name
        description: Human-readable zone name within the borough.
        tests:
          - not_null
      - name: service_zone
        description: TLC service zone classification (Yellow Zone, Boro Zone, etc.).
