version: 2

models:
  - name: fct_trips
    description: >
      Production Fact Table (Star Schema). One row per completed NYC Yellow Taxi trip.
      Contains all trip metrics, time dimensions, financial measures, and denormalized
      zone labels. Materialized as a physical TABLE for sub-second analytical query performance.
    columns:
      - name: trip_id
        description: "MD5 surrogate primary key — unique identifier per trip."
        tests:
          - unique
          - not_null

      - name: pickup_at
        description: "Timestamp when the meter was engaged."
        tests:
          - not_null

      - name: pickup_location_id
        description: "Foreign key to dim_zones.location_id for pickup zone."
        tests:
          - not_null
          - relationships:
              to: ref('dim_zones')
              field: location_id

      - name: dropoff_location_id
        description: "Foreign key to dim_zones.location_id for dropoff zone."
        tests:
          - not_null

      - name: fare_amount
        description: "Metered fare (must be positive)."
        tests:
          - not_null

      - name: total_amount
        description: "Total amount charged (must be positive)."
        tests:
          - not_null

      - name: trip_distance
        description: "Trip distance in miles."
        tests:
          - not_null

      - name: trip_duration_minutes
        description: "Calculated duration in minutes (dropoff - pickup)."
        tests:
          - not_null

      - name: payment_method
        description: "Human-readable payment type label."
        tests:
          - accepted_values:
              values: ['Credit Card', 'Cash', 'No Charge', 'Dispute', 'Unknown', 'Voided Trip', 'Other']

      - name: time_of_day_segment
        description: "Categorical time-of-day bucket for pickup hour."
        tests:
          - accepted_values:
              values: ['Morning Rush', 'Midday', 'Evening Rush', 'Night', 'Late Night / Early Morning']

  - name: dim_zones
    description: >
      Production Dimension Table (Star Schema). Contains all 265 NYC TLC Taxi Zone records
      with borough, zone name, and service zone. Joins to fct_trips on location_id.
    columns:
      - name: location_id
        description: "Primary key — unique zone identifier."
        tests:
          - unique
          - not_null

      - name: borough
        description: "NYC Borough name."
        tests:
          - not_null

      - name: zone
        description: "Descriptive zone name within the borough."
        tests:
          - not_null
