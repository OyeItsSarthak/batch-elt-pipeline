[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-taxi-batch-elt"
version = "1.0.0"
description = "Production-grade Batch ELT Pipeline for NYC Taxi & Limousine Commission Data"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Sarthak Sharma", email = "sarthakjpr2005@gmail.com" }
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
